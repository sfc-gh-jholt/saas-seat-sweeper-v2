version: 2
name: SEAT_SWEEPER
schema: APP
ignore:
- node_modules
- .env*
- __pycache__
- '*.pyc'
- .next
- .git
- snowflake.log
- app.yml.builder
- __tests__
- '*.tsbuildinfo'
label: Seat Sweeper
description: Inactive seat opportunity by vendor and department.
icon: public/icon.svg
auto_suspend_secs: 300
install:
  commands:
  - - npm
    - ci
    - --include=dev
build:
  commands:
  - - npm
    - run
    - build
  - - cp
    - -r
    - .next/static
    - .next/standalone/.next/static
  - - cp
    - -r
    - public
    - .next/standalone/public
run:
  command:
  - node
  - .next/standalone/server.js
  executeAsCaller: true
default_target: lab
targets:
  lab:
    database: SEAT_SWEEPER_LAB
    query_warehouse: SEAT_SWEEPER_WH
    build_eai: SEAT_SWEEPER_BUILD_EAI
    environment_variables:
    - name: LAB_DB
      value: SEAT_SWEEPER_LAB
    - name: LAB_WH
      value: SEAT_SWEEPER_WH
    - name: SNOWFLAKE_SDK_QUIET
      value: 'true'
    # Postgres host, login and CA are per-account secrets written by setup (scripts/pg_setup.py secret).
    secrets:
    - name: PG_APP_LOGIN
      secret: SEAT_SWEEPER_LAB.GOVERNANCE.PG_APP_LOGIN
    - name: PG_HOST
      secret: SEAT_SWEEPER_LAB.GOVERNANCE.PG_HOST
    - name: PG_CA_CERT
      secret: SEAT_SWEEPER_LAB.GOVERNANCE.PG_CA_CERT
    external_access_integrations:
    - SEAT_SWEEPER_PG_EAI
